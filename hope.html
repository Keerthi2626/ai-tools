<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        nav {
            display: flex;
            gap: 1rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            background: #ffffff;
            color: #333333;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            text-transform: uppercase;
            transition: background 0.3s, color 0.3s;
        }

        .btn:hover {
            background: #ff7eb3;
            color: #ffffff;
        }

        footer {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Tools Hub</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#tools">Tools</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <div id="home" class="container">
        <h1>All in One AI Tools</h1>
        <p>Explore the power of AI to simplify your tasks and boost productivity.</p>
        <div class="buttons">
            <a href="sss.html" class="btn">For Students</a>
            <a href="te.html" class="btn">For Teachers</a>
            <a href="dev.html" class="btn">For Developers</a>
            <a href="work.html" class="btn">For Researchers</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 AI Tools Hub. All rights reserved.</p>
    </footer>
</body>
</html>
